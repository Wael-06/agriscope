<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Noto+Sans+Arabic:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=7" />
  <title>AgriScope — Adapting Farms with NASA Data</title>
</head>
<body class="landing-body">
  <div id="landing-stage" class="landing-stage">
    <header class="landing-topbar">
      <a href="index.html" class="landing-brand">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true" style="width:28px;height:28px;">
          <rect width="36" height="36" rx="10" fill="#156248" />
          <circle cx="18" cy="14.5" r="5.5" fill="#f0b443" />
          <path d="M5 27c4-5 8-7 13-7s9 2 13 7" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" />
        </svg>
        <span class="landing-brand-name">AgriScope</span>
      </a>

      <div class="landing-top-actions">
        <a href="planner.html" class="landing-quick-link">Field Planner</a>
        <a href="map.html" class="landing-quick-link">Vulnerability Map</a>
        <a href="advisor.html" class="landing-quick-link">AI Advisor</a>
        <div id="api-status" class="status-pill status-mock">Checking…</div>
      </div>
    </header>

    <div id="globe-container"></div>

    <div class="globe-hud">
      <span class="hud-tag">NASA Space Apps Challenge 2026</span>
      <h1>AgriScope</h1>
      <p>Supporting climate-resilient farms with NASA POWER, MODIS NDVI &amp; Open-Meteo</p>
      <div class="hud-actions">
        <button id="enter-planner-btn" type="button" class="hud-btn">Explore Agricultural Regions</button>
        <button id="enter-map-btn" type="button" class="hud-btn-ghost">Open Vulnerability Map</button>
      </div>
      <span class="hud-hint">Click any glowing region on Earth to zoom in and start analyzing</span>
    </div>
  </div>

  <script src="https://unpkg.com/globe.gl@2.32.1/dist/globe.gl.min.js"></script>
  <script src="js/api.js?v=7"></script>
  <script src="js/state.js?v=7"></script>
  <script src="js/globe.js?v=7"></script>
</body>
</html>
